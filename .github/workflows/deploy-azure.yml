name: Publish reviewed site to Azure
# Manual only. Creating or merging a PR never deploys this website.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'HTTPS production origin (confirm custom-domain readiness first)'
        required: true
        default: 'https://neworleanscrime.org'
        type: string
permissions:
  contents: read
concurrency:
  group: new-orleans-crime-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ inputs.site_url }}
      - name: Upload reviewed static output
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: master
